name: CI

on:
  push:

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=10
      - name: Check & Test
        run: bun runx ci check
      # Applies every migration to a fresh local D1 (no Cloudflare credentials needed).
      - name: Validate D1 Migrations
        run: pnpm db:push:local

  # The app runs locally but against the remote D1, so merged migrations still need applying there.
  # Only runs when the DEPLOY_ENABLED variable is "true", so forks without Cloudflare
  # credentials skip it instead of failing.
  migrate:
    name: Apply D1 Migrations
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: ${{ github.workflow }}-migrate
    # Cloudflare secrets live in this environment so only its allowed branches can read them.
    environment: production
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=10
      - name: Apply D1 Migrations
        run: pnpm db:push:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
